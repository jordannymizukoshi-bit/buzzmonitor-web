<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzmonitor Automático</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status-card {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .status-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .status-text {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .status-text.running {
            color: #f39c12;
        }

        .status-text.success {
            color: #27ae60;
        }

        .status-text.error {
            color: #e74c3c;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            color: #c33;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .info-box {
            background: #f0f7ff;
            border: 1px solid #bde4ff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-box h3 {
            color: #0066cc;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .info-box p {
            color: #333;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .info-box ol {
            margin-left: 20px;
            color: #333;
            font-size: 13px;
        }

        .info-box li {
            margin-bottom: 6px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 Buzzmonitor</h1>
            <p>Automação de Respostas</p>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <h3>Como funciona:</h3>
            <ol>
                <li>Preencha a planilha do Sheets</li>
                <li>Clique em "Executar"</li>
                <li>Faça login (vai abrir em nova aba)</li>
                <li>Aguarde o processamento</li>
            </ol>
        </div>

        <!-- Status -->
        <div class="status-card">
            <div class="status-label">Status</div>
            <div class="status-text" id="statusText">Aguardando</div>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="btn btn-primary" id="runBtn" onclick="runScript()">
                ▶️ Executar Agora
            </button>
            <button class="btn btn-secondary" id="refreshBtn" onclick="refreshStatus()">
                🔄 Atualizar
            </button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>
                Precisa de ajuda? Veja o
                <a href="#" onclick="alert('Consulte o arquivo README_USUARIO.txt')">
                    guia de instruções
                </a>
            </p>
        </div>
    </div>

    <script>
        // Atualizar status a cada 2 segundos
        setInterval(refreshStatus, 2000);

        async function refreshStatus() {
            try {
                const response = await fetch("/api/status");
                const data = await response.json();

                const statusText = document.getElementById("statusText");
                const runBtn = document.getElementById("runBtn");
                const errorMsg = document.getElementById("errorMessage");

                // Atualizar texto de status
                let displayText = data.status;
                if (data.running) {
                    displayText = `<span class="spinner"></span>${data.status}`;
                }

                statusText.innerHTML = displayText;

                // Atualizar classe CSS
                statusText.className = "status-text";
                if (data.running) {
                    statusText.classList.add("running");
                } else if (data.status.includes("Concluído")) {
                    statusText.classList.add("success");
                } else if (data.status.includes("Erro")) {
                    statusText.classList.add("error");
                }

                // Mostrar/esconder botão
                runBtn.disabled = data.running;

                // Mostrar erro se houver
                if (data.error) {
                    errorMsg.textContent = `❌ Erro: ${data.error}`;
                    errorMsg.classList.add("show");
                } else {
                    errorMsg.classList.remove("show");
                }
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
            }
        }

        async function runScript() {
            try {
                const response = await fetch("/api/run", {
                    method: "POST",
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.error || "Erro ao iniciar script");
                    return;
                }

                // Abrir página de login do Buzzmonitor em nova aba
                // (o script vai abrir a página automaticamente)
                alert(
                    "Script iniciado!\n\n" +
                    "Uma aba do navegador vai abrir automaticamente para você fazer login.\n\n" +
                    "Deixe o navegador aberto enquanto o script processa os tickets."
                );

                refreshStatus();
            } catch (error) {
                console.error("Erro:", error);
                alert("Erro ao executar script");
            }
        }
    </script>
</body>
</html>
